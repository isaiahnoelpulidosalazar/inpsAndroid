name: Test inpsAndroid

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Format Check and Lint
        run: ./gradlew spotlessCheck lint

      - name: Run Unit Tests with JaCoCo Coverage
        run: ./gradlew test jacocoTestReport

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            inpsAndroid/build/reports/tests/
            app/build/reports/tests/
            inpsAndroid/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.html

      - name: Upload JaCoCo Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            inpsAndroid/build/reports/jacoco/jacocoTestReport/
            app/build/reports/jacoco/jacocoTestReport/
