plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aistudio.inpsandroid.demo'
    compileSdk 36

    defaultConfig {
        applicationId "com.aistudio.inpsandroid.kxmpzq"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':inpsAndroid')
    implementation 'com.google.android.material:material:1.12.0'
}
