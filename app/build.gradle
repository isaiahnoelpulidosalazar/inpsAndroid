plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aistudio.inpsandroid.demo'
    compileSdk 37

    defaultConfig {
        applicationId "com.aistudio.inpsandroid.kxmpzq"
        minSdk 24
        targetSdk 37
        versionCode 5
        versionName "3.0.4"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                dependsOn ':inpsAndroid:prepareRobolectricSdk'
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir',
                    project(':inpsAndroid').layout.buildDirectory.dir('robolectric-deps').get().asFile.absolutePath
            }
        }
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        lintConfig = file('lint.xml')
    }
}

dependencies {
    implementation project(':inpsAndroid')
    implementation libs.material
    implementation libs.viewpager2

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
}
