plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.isaiahnoelpulidosalazar.inpsandroid'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    // Public API types extend/expose these, so consumers get them transitively.
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.recyclerview:recyclerview:1.4.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.1'
    // Theme attributes (colorSurface, ...) used by the drawables come from Material.
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.isaiahnoelpulidosalazar'
                artifactId = 'inpsAndroid'
                version = '2.0.0'
                // changes in 2.0.0: see migrating_to_v2.md
            }
        }
    }
}
