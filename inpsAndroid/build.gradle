plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.isaiahnoelpulidosalazar.inpsandroid'
    compileSdk 36
    resourcePrefix 'inps_'

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                dependsOn 'prepareRobolectricSdk'
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric-deps').get().asFile.absolutePath
            }
        }
    }

    lint {
        abortOnError = true
        warningsAsErrors = false
        checkReleaseBuilds = true
        lintConfig = file('lint.xml')
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    // Resolved via Gradle (cached in ~/.gradle) so Robolectric never fetches jars via raw HttpURLConnection at test time.
    robolectricSdk
}

tasks.register('prepareRobolectricSdk', Sync) {
    from configurations.robolectricSdk
    into layout.buildDirectory.dir('robolectric-deps')
}

dependencies {
    api 'androidx.appcompat:appcompat:1.8.0'
    api 'androidx.recyclerview:recyclerview:1.4.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'com.google.android.material:material:1.12.0'
    robolectricSdk 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.isaiahnoelpulidosalazar'
                artifactId = 'inpsAndroid'
                version = '3.0.3'

                pom {
                    name = 'inpsAndroid'
                    description = 'Lightweight Android utility, UI widget, and educational algorithm library.'
                    url = 'https://github.com/isaiahnoelpulidosalazar/inpsAndroid'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'isaiahnoelpulidosalazar'
                            name = 'Isaiah Noel Pulido Salazar'
                            email = 'isaiahnoelpulidosalazar@gmail.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/isaiahnoelpulidosalazar/inpsAndroid.git'
                        developerConnection = 'scm:git:ssh://github.com/isaiahnoelpulidosalazar/inpsAndroid.git'
                        url = 'https://github.com/isaiahnoelpulidosalazar/inpsAndroid'
                    }
                }
            }
        }
    }
}
